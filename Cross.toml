[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update -qq",
    "apt-get install -y python3.10-dev:arm64 libpython3.10-dev:arm64",
]

[target.aarch64-unknown-linux-gnu.env]
volumes = []
passthrough = []
set.PYO3_CROSS = "1"
set.PYO3_CROSS_PYTHON_VERSION = "3.10"
set.PYO3_CROSS_LIB_DIR = "/usr/lib/aarch64-linux-gnu"
