# Build links PyO3 against the bundled python-build-standalone interpreter in
# vendor/python (fetched by scripts/fetch-python.sh). This makes the embedded
# interpreter self-contained — no dependency on a system Python.
#
# These paths are absolute for the dev checkout. A release build/installer ships
# vendor/python next to the binary and relies on a relative rpath + PYTHONHOME
# resolved at runtime (see src/pyenv.rs).
[env]
PYO3_PYTHON = { value = "/Users/dmitryzap/Projects/learning/boinc-qouta-rs/vendor/python/bin/python3.12", force = true }
# Embedded interpreter's stdlib home (dev/tests). At release this is set at
# runtime by pyenv::prepare_embedded_python from the exe-relative bundle.
PYTHONHOME = { value = "/Users/dmitryzap/Projects/learning/boinc-qouta-rs/vendor/python", force = true }

[build]
rustflags = [
  "-L", "/Users/dmitryzap/Projects/learning/boinc-qouta-rs/vendor/python/lib",
  "-C", "link-arg=-Wl,-rpath,/Users/dmitryzap/Projects/learning/boinc-qouta-rs/vendor/python/lib",
]
